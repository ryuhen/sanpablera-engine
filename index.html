<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanpablera Engine</title>
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #111;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
    </style>
    <!-- 1. Cargar Babylon.js -->
    <script src="./node_modules/babylonjs/babylon.js"></script>
    <!-- 1b. Cargador glTF/GLB: el babylon.js base NO sabe leer .glb. Sin este
         script el mannequin de assets/characters/mannequin.glb jamas se ve. -->
    <script src="./node_modules/babylonjs-loaders/babylon.glTF2FileLoader.js"></script>
    <!-- 2. Cargar el motor de físicas Cannon.js (Necesario para las colisiones y la gravedad) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
</head>
<body>
    <canvas id="renderCanvas"></canvas>

    <!-- 3. Cargar scripts de la UI y el motor -->
    <script type="module" src="./src/core/Engine.js"></script>
    <script src="./src/tools/aiAssistant.js"></script>

</body>
</html>
